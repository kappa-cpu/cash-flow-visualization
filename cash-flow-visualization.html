<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="資産管理">
<meta name="theme-color" content="#1D9E75">
<title>資産管理アプリ</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
:root {
  --bg0:#ffffff; --bg1:#f6f6f3; --bg2:#efede8;
  --bg-ok:#e8f5ef; --bg-ng:#fae8e2;
  --bd:rgba(0,0,0,0.12);
  --t0:#1c1b19; --t1:#6b6a65; --t2:#9e9d97;
  --ts:#157c55; --td:#b83c1a;
  --accent:#1D9E75;
  --r:8px; --rl:12px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg0:#1c1b19; --bg1:#242320; --bg2:#2c2b28;
    --bg-ok:#0d3d26; --bg-ng:#3d1810;
    --bd:rgba(255,255,255,0.13);
    --t0:#eeede8; --t1:#9e9d97; --t2:#6b6a65;
    --ts:#4bc890; --td:#f08060;
  }
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg2);color:var(--t0);min-height:100dvh;}

/* Header */
#hdr{background:var(--bg0);border-bottom:0.5px solid var(--bd);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
#hdr h1{font-size:16px;font-weight:600;display:flex;align-items:center;gap:7px;}
#saved{font-size:11px;color:var(--ts);opacity:0;transition:opacity .4s;display:flex;align-items:center;gap:3px;}
#saved.show{opacity:1;}

/* Layout */
#wrap{display:flex;gap:12px;padding:12px;align-items:flex-start;max-width:820px;margin:0 auto;}
#lp{width:224px;flex-shrink:0;display:flex;flex-direction:column;gap:10px;}
#rp{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;}

/* Cards */
.sc{background:var(--bg0);border:0.5px solid var(--bd);border-radius:var(--rl);padding:12px;}
.ic{border:0.5px solid var(--bd);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.st{font-size:12px;color:var(--t1);font-weight:500;display:flex;align-items:center;gap:5px;}
.ni{font-size:12px;color:var(--t2);text-align:center;padding:2px 0;}
.row{display:flex;align-items:center;gap:6px;}

/* Inputs */
input[type=number],input[type=text],input[type=date]{
  background:var(--bg1);border:0.5px solid var(--bd);border-radius:6px;
  color:var(--t0);padding:7px 9px;font-family:inherit;font-size:16px;
  outline:none;-webkit-appearance:none;appearance:none;width:100%;
}
input[type=number]{-moz-appearance:textfield;}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;}
input:focus{border-color:var(--accent);box-shadow:0 0 0 2.5px rgba(29,158,117,.15);}
input::placeholder{color:var(--t2);}

/* Buttons */
button{background:var(--bg1);border:0.5px solid var(--bd);border-radius:6px;color:var(--t0);
  cursor:pointer;font-family:inherit;font-size:13px;padding:5px 10px;
  display:inline-flex;align-items:center;gap:3px;
  transition:background .12s;-webkit-tap-highlight-color:transparent;}
button:hover{background:var(--bg2);}
button:active{transform:scale(.96);}
.db{padding:4px 8px;color:var(--td);font-size:14px;flex-shrink:0;}
.tb{padding:4px 10px;flex-shrink:0;font-size:13px;}

/* Day input */
.di{width:66px!important;font-size:22px!important;font-weight:600;text-align:center;padding:4px 2px!important;}
.dl{font-size:13px;color:var(--t1);white-space:nowrap;}

/* Month grid */
.mg{display:grid;grid-template-columns:1fr 1fr;gap:4px 6px;}
.mc{display:flex;align-items:center;gap:3px;}
.ml{font-size:11px;color:var(--t1);width:22px;flex-shrink:0;}
.mi{font-size:13px!important;padding:4px 4px!important;}

/* Summary */
.sg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
.sk{background:var(--bg1);border-radius:var(--r);padding:10px 12px;}
.sl{font-size:11px;color:var(--t1);margin-bottom:3px;}
.sv{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* Events */
.er{display:flex;justify-content:space-between;align-items:center;padding:8px 0;}
.ei{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* Mobile */
@media(max-width:540px){
  #wrap{flex-direction:column;padding:10px;}
  #lp{width:100%!important;flex-shrink:unset!important;order:2;}
  #rp{order:1;}
  .sv{font-size:13px;}
  .sg{gap:6px;}
  .sk{padding:8px 10px;}
}
</style>
</head>
<body>

<div id="hdr">
  <h1><i class="ti ti-chart-line" style="color:var(--accent);font-size:20px;"></i>資産管理アプリ</h1>
  <span id="saved"><i class="ti ti-device-floppy"></i>保存済み</span>
</div>

<div id="wrap">

  <!-- 左パネル (入力) -->
  <div id="lp">

    <div class="sc">
      <p class="st" style="margin-bottom:8px;"><i class="ti ti-wallet" style="font-size:14px;"></i>現在の預金残高</p>
      <div class="row">
        <input type="number" id="bal" value="500000" min="0" style="flex:1;font-size:18px;font-weight:500;" oninput="S()">
        <span style="font-size:14px;color:var(--t1);">円</span>
      </div>
    </div>

    <div class="sc">
      <div class="sh">
        <p class="st"><i class="ti ti-briefcase" style="font-size:14px;"></i>バイト給与</p>
        <button onclick="addJob()"><i class="ti ti-plus" style="font-size:13px;"></i>追加</button>
      </div>
      <div id="jl" style="display:flex;flex-direction:column;gap:8px;"></div>
      <p id="nj" class="ni">バイトなし</p>
    </div>

    <div class="sc">
      <div class="sh">
        <p class="st"><i class="ti ti-credit-card" style="font-size:14px;"></i>クレカ引き落とし</p>
        <button onclick="addCard()"><i class="ti ti-plus" style="font-size:13px;"></i>追加</button>
      </div>
      <div id="cl" style="display:flex;flex-direction:column;gap:8px;"></div>
      <p id="nc" class="ni">カードなし</p>
    </div>

    <div class="sc">
      <div class="sh">
        <p class="st"><i class="ti ti-calendar-event" style="font-size:14px;"></i>その他の入出金</p>
        <button onclick="addTx()"><i class="ti ti-plus" style="font-size:13px;"></i>追加</button>
      </div>
      <div id="tl" style="display:flex;flex-direction:column;gap:8px;"></div>
      <p id="nt" class="ni">日付・金額を個別に入力</p>
    </div>

  </div>

  <!-- 右パネル (グラフ) -->
  <div id="rp">

    <div class="sg">
      <div class="sk"><p class="sl">現在の残高</p><p class="sv" id="s1">—</p></div>
      <div class="sk"><p class="sl">最低残高（6ヶ月）</p><p class="sv" id="s2">—</p></div>
      <div class="sk"><p class="sl">今月の収支</p><p class="sv" id="s3">—</p></div>
    </div>

    <div class="sc">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
        <p style="font-size:12px;color:var(--t1);">今後6ヶ月の残高推移</p>
        <div style="display:flex;gap:10px;font-size:11px;color:var(--t1);">
          <span style="display:flex;align-items:center;gap:3px;"><span style="width:8px;height:8px;border-radius:50%;background:#1D9E75;display:inline-block;"></span>入金</span>
          <span style="display:flex;align-items:center;gap:3px;"><span style="width:8px;height:8px;border-radius:50%;background:#D85A30;display:inline-block;"></span>引き落とし</span>
        </div>
      </div>
      <div style="position:relative;height:230px;">
        <canvas id="chart" aria-label="今後6ヶ月の残高推移グラフ"></canvas>
      </div>
    </div>

    <div class="sc">
      <p style="font-size:12px;color:var(--t1);margin-bottom:8px;font-weight:500;">直近の入出金予定</p>
      <div id="el"></div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
/* ── 定数 ── */
let CH=null,TM=null;
const DAYS=180;
const T0=new Date();T0.setHours(0,0,0,0);
const MONTHS=(()=>{const a=[];for(let i=0;i<6;i++){const d=new Date(T0.getFullYear(),T0.getMonth()+i,1);a.push({m:d.getMonth()+1,k:`${d.getFullYear()}-${d.getMonth()+1}`});}return a;})();
const T0S=(d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()))(T0);
function p2(n){return String(n).padStart(2,'0');}
function ds(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function fmt(n){const r=Math.round(n);return(r<0?'-':'')+'¥'+Math.abs(r).toLocaleString('ja-JP');}

/* ── DOM生成ヘルパー ── */
function mgHTML(cls){
  return`<div class="mg">${MONTHS.map(m=>`<div class="mc"><span class="ml">${m.m}月</span><input type="number" min="0" data-k="${m.k}" class="${cls} mi" placeholder="-" oninput="S()"></div>`).join('')}</div>`;
}
function drHTML(v,lbl,cls){
  return`<div class="row"><span class="dl">毎月</span><input type="number" value="${v}" min="1" max="31" class="${cls} di" oninput="S()"><span class="dl">${lbl}</span></div>`;
}

/* ── バイト追加 ── */
function addJob(r,skip){
  const list=document.getElementById('jl'),n=list.children.length+1;
  const d=document.createElement('div');d.className='ic';
  d.innerHTML=`<div class="row"><input type="text" class="jn" style="flex:1;font-size:14px;" placeholder="バイト先名" onchange="S()"><button class="db" onclick="this.closest('.ic').remove();sync();S();" aria-label="削除"><i class="ti ti-x"></i></button></div>${drHTML(25,'日払い','jd')}${mgHTML('jm')}`;
  list.appendChild(d);
  d.querySelector('.jn').value=r?r.name||'':'バイト'+n;
  if(r&&r.day)d.querySelector('.jd').value=r.day;
  if(r&&r.months)Object.entries(r.months).forEach(([k,v])=>{const i=d.querySelector(`[data-k="${k}"]`);if(i&&v)i.value=v;});
  document.getElementById('nj').style.display='none';
  if(!skip)S();
}

/* ── クレカ追加 ── */
function addCard(r,skip){
  const list=document.getElementById('cl'),n=list.children.length+1;
  const d=document.createElement('div');d.className='ic';
  d.innerHTML=`<div class="row"><input type="text" class="cn" style="flex:1;font-size:14px;" placeholder="カード名" onchange="S()"><button class="db" onclick="this.closest('.ic').remove();sync();S();" aria-label="削除"><i class="ti ti-x"></i></button></div>${drHTML(10,'日引き落とし','cd')}${mgHTML('cm')}`;
  list.appendChild(d);
  d.querySelector('.cn').value=r?r.name||'':'クレカ'+n;
  if(r&&r.day)d.querySelector('.cd').value=r.day;
  if(r&&r.months)Object.entries(r.months).forEach(([k,v])=>{const i=d.querySelector(`[data-k="${k}"]`);if(i&&v)i.value=v;});
  document.getElementById('nc').style.display='none';
  if(!skip)S();
}

/* ── 個別入出金追加 ── */
function addTx(r,skip){
  const list=document.getElementById('tl');
  const d=document.createElement('div');d.className='ic';
  d.innerHTML=`<div class="row"><input type="date" class="td" style="flex:1;font-size:14px;min-width:0;" oninput="S()"><button class="tb" data-t="expense" onclick="toggleT(this)" style="color:var(--td);">出金</button><button class="db" onclick="this.closest('.ic').remove();sync();S();" aria-label="削除"><i class="ti ti-x"></i></button></div><div class="row"><input type="text" class="tl" style="flex:1;font-size:14px;" placeholder="内容（例：旅行代、教科書）" onchange="S()"><input type="number" class="ta" value="0" min="0" style="width:80px;font-size:14px;" oninput="S()"><span style="font-size:12px;color:var(--t1);flex-shrink:0;">円</span></div>`;
  list.appendChild(d);
  d.querySelector('.td').value=r?r.dateStr||T0S:T0S;
  d.querySelector('.tl').value=r?r.label||'':'';
  d.querySelector('.ta').value=r?r.amount||0:0;
  if(r&&r.type==='income'){const b=d.querySelector('.tb');b.dataset.t='income';b.textContent='入金';b.style.color='var(--ts)';}
  document.getElementById('nt').style.display='none';
  if(!skip)S();
}

function toggleT(b){
  const inc=b.dataset.t==='expense';
  b.dataset.t=inc?'income':'expense';b.textContent=inc?'入金':'出金';
  b.style.color=inc?'var(--ts)':'var(--td)';S();
}

/* ── 表示同期 ── */
function sync(){
  document.getElementById('nj').style.display=document.querySelectorAll('#jl .ic').length===0?'block':'none';
  document.getElementById('nc').style.display=document.querySelectorAll('#cl .ic').length===0?'block':'none';
  document.getElementById('nt').style.display=document.querySelectorAll('#tl .ic').length===0?'block':'none';
}

/* ── DOM読み取り ── */
function getMonths(el,cls){const m={};el.querySelectorAll('.'+cls).forEach(i=>{if(+i.value)m[i.dataset.k]=+i.value;});return m;}
function getAllMonths(el,cls){const m={};el.querySelectorAll('.'+cls).forEach(i=>{m[i.dataset.k]=+i.value||0;});return m;}
function getJobs(){return[...document.querySelectorAll('#jl .ic')].map(d=>({name:d.querySelector('.jn').value||'バイト',day:Math.max(1,Math.min(31,+d.querySelector('.jd').value||25)),months:getMonths(d,'jm')}));}
function getCards(){return[...document.querySelectorAll('#cl .ic')].map(d=>({name:d.querySelector('.cn').value||'カード',day:Math.max(1,Math.min(31,+d.querySelector('.cd').value||10)),months:getMonths(d,'cm')}));}
function getTxs(){return[...document.querySelectorAll('#tl .ic')].map(d=>({dateStr:d.querySelector('.td').value,type:d.querySelector('.tb').dataset.t,label:d.querySelector('.tl').value||'その他',amount:+d.querySelector('.ta').value||0})).filter(t=>t.dateStr&&t.amount>0);}

/* ── 保存・読み込み ── */
function save(){
  const data={
    bal:+document.getElementById('bal').value||0,
    jobs:[...document.querySelectorAll('#jl .ic')].map(d=>({name:d.querySelector('.jn').value,day:+d.querySelector('.jd').value||25,months:getAllMonths(d,'jm')})),
    cards:[...document.querySelectorAll('#cl .ic')].map(d=>({name:d.querySelector('.cn').value,day:+d.querySelector('.cd').value||10,months:getAllMonths(d,'cm')})),
    txs:[...document.querySelectorAll('#tl .ic')].map(d=>({dateStr:d.querySelector('.td').value,type:d.querySelector('.tb').dataset.t,label:d.querySelector('.tl').value,amount:+d.querySelector('.ta').value||0}))
  };
  try{localStorage.setItem('at-v1',JSON.stringify(data));flashSaved();}catch(e){}
}
function flashSaved(){const e=document.getElementById('saved');e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2000);}
function load(){
  try{
    const raw=localStorage.getItem('at-v1');if(!raw)return false;
    const d=JSON.parse(raw);
    if(d.bal)document.getElementById('bal').value=d.bal;
    (d.jobs||[]).forEach(j=>addJob(j,true));
    (d.cards||[]).forEach(c=>addCard(c,true));
    (d.txs||[]).forEach(t=>addTx(t,true));
    return true;
  }catch(e){return false;}
}

/* ── 残高計算 ── */
function project(bal,jobs,cards,txs){
  const labels=[],bals=[],evts=[];let b=bal;
  for(let i=0;i<=DAYS;i++){
    const d=new Date(T0);d.setDate(T0.getDate()+i);
    const dom=d.getDate(),key=`${d.getFullYear()}-${d.getMonth()+1}`,dstr=ds(d);
    if(i>0){
      for(const j of jobs){if(dom===j.day){const a=j.months[key]||0;if(a){b+=a;evts.push({date:new Date(d),label:j.name,amount:a,type:'income',idx:i});}}}
      for(const c of cards){if(dom===c.day){const a=c.months[key]||0;if(a){b-=a;evts.push({date:new Date(d),label:c.name,amount:a,type:'expense',idx:i});}}}
      for(const t of txs){if(t.dateStr===dstr){if(t.type==='income'){b+=t.amount;evts.push({date:new Date(d),label:t.label,amount:t.amount,type:'income',idx:i});}else{b-=t.amount;evts.push({date:new Date(d),label:t.label,amount:t.amount,type:'expense',idx:i});}}}
    }
    labels.push(`${d.getMonth()+1}/${d.getDate()}`);bals.push(Math.round(b));
  }
  return{labels,bals,evts};
}

/* ── 更新 ── */
function S(){clearTimeout(TM);TM=setTimeout(update,150);}
function update(){
  const cur=+document.getElementById('bal').value||0;
  const jobs=getJobs(),cards=getCards(),txs=getTxs();
  sync();
  const{labels,bals,evts}=project(cur,jobs,cards,txs);

  document.getElementById('s1').textContent=fmt(cur);
  const minB=Math.min(...bals);
  const s2=document.getElementById('s2');s2.textContent=fmt(minB);s2.style.color=minB<0?'var(--td)':'var(--t0)';
  const tk=`${T0.getFullYear()}-${T0.getMonth()+1}`;
  const net=jobs.reduce((s,j)=>s+(j.months[tk]||0),0)-cards.reduce((s,c)=>s+(c.months[tk]||0),0);
  const s3=document.getElementById('s3');s3.textContent=(net>=0?'+':'')+fmt(net);s3.style.color=net>=0?'var(--ts)':'var(--td)';

  const eiSet=new Set(evts.map(e=>e.idx));
  if(CH)CH.destroy();
  CH=new Chart(document.getElementById('chart'),{
    type:'line',
    data:{labels,datasets:[{label:'残高',data:bals,borderColor:'#1D9E75',borderWidth:2,backgroundColor:'rgba(29,158,117,.07)',fill:true,tension:.25,
      pointRadius:bals.map((_,i)=>eiSet.has(i)?5:1),
      pointBackgroundColor:bals.map((_,i)=>{const e=evts.find(e=>e.idx===i);return!e?'#1D9E75':e.type==='income'?'#1D9E75':'#D85A30';}),
      pointBorderWidth:bals.map((_,i)=>eiSet.has(i)?2:0),
      pointBorderColor:bals.map((_,i)=>{const e=evts.find(e=>e.idx===i);return!e?'transparent':e.type==='income'?'#0F6E56':'#993C1D';})}]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{backgroundColor:'rgba(20,20,20,.9)',titleColor:'#e8e8e8',bodyColor:'#b8b8b8',padding:10,
        callbacks:{title:its=>`${its[0].label}の残高`,label:ctx=>`  残高: ${fmt(ctx.raw)}`,
          afterBody:its=>{const idx=its[0].dataIndex;return evts.filter(e=>e.idx===idx).map(e=>`  ${e.type==='income'?'↑':'↓'} ${e.label}  ${fmt(e.amount)}`);}}
      }},
      scales:{
        x:{ticks:{maxTicksLimit:8,font:{size:11},color:'#888',autoSkip:true,maxRotation:0},grid:{color:'rgba(128,128,128,.1)'}},
        y:{ticks:{callback:v=>{const a=Math.abs(v),s=v<0?'-':'';return a>=10000?s+(a/10000).toFixed(1).replace('.0','')+'万':s+a.toLocaleString();},font:{size:11},color:'#888'},grid:{color:'rgba(128,128,128,.1)'}}
      }
    }
  });

  const upcoming=evts.filter(e=>e.date>=T0).slice(0,8);
  const el=document.getElementById('el');
  el.innerHTML=upcoming.length===0
    ?'<p style="font-size:13px;color:var(--t2);padding:4px 0;">入金・引き落としの入力がありません</p>'
    :upcoming.map((e,i)=>`<div class="er" style="${i<upcoming.length-1?'border-bottom:0.5px solid var(--bd);':''}">
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="ei" style="background:${e.type==='income'?'var(--bg-ok)':'var(--bg-ng)'};">
          <i class="ti ${e.type==='income'?'ti-arrow-up':'ti-arrow-down'}" style="font-size:14px;color:${e.type==='income'?'var(--ts)':'var(--td)'};"></i>
        </div>
        <div>
          <p style="font-size:14px;font-weight:500;color:var(--t0);">${e.label}</p>
          <p style="font-size:11px;color:var(--t1);">${e.date.getFullYear()}年${e.date.getMonth()+1}月${e.date.getDate()}日</p>
        </div>
      </div>
      <span style="font-size:14px;font-weight:500;flex-shrink:0;color:${e.type==='income'?'var(--ts)':'var(--td)'};">${e.type==='income'?'+':'-'}${fmt(e.amount)}</span>
    </div>`).join('');

  save();
}

/* ── 起動 ── */
if(!load()){addJob();addCard();}
sync();S();
</script>
</body>
</html>
